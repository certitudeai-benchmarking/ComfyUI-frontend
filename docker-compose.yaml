services:
  comfyui:
    image: 050451373362.dkr.ecr.us-east-1.amazonaws.com/clarity-v2/comfyui-frontend:latest
    restart: always
    
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188"]
    
    ports:
      - "8001:8188"
    
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
  
    
    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Health check using wget (available in your container)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8188"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # 5 minutes for model loading
    
    # Optional: Resource limits
    # mem_limit: 16g
    # shm_size: 2g
